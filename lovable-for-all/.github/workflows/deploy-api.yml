name: Deploy API to Railway

on:
  push:
    branches: [main]
    paths:
      - "hatchery-studio/apps/api/**"
      - "hatchery-studio/packages/db/**"
      - "hatchery-studio/packages/shared/**"
      - "hatchery-studio/packages/ai-providers/**"

defaults:
  run:
    working-directory: hatchery-studio

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck --filter=@hatchery/api

      - name: Deploy to Railway
        uses: railwayapp/railway-deploy@v1
        with:
          service: hatchery-api
          environment: production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
